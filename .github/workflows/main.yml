name: Build Foodie Go APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Check Flutter Plugins
        run: flutter pub deps
      
          - name: Find Old Android Embedding
        run: |
          grep -R "PluginRegistry.Registrar\|registerWith" . --exclude-dir=.git || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foodie-go-release
          path: build/app/outputs/flutter-apk/app-release.apk
